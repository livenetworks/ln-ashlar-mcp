<!-- ln-ashlar Stat Card Component -->
<article class="ln-stat-card{{custom_class}}" id="{{id}}" data-ln-stat-card>
	<div class="ln-stat-card-header">
		<span class="ln-stat-card-title">{{title}}</span>
		<!-- ICON_SLOT -->
	</div>
	<div class="ln-stat-card-body">
		<span class="ln-stat-card-value">{{value}}</span>
		<!-- TREND_SLOT -->
	</div>
	<p class="ln-stat-card-footer">{{description}}</p>
</article>
