<!-- ln-ashlar Filter List Snippet -->
<div class="ln-filter-group" id="{{id}}">
	<input type="search" data-ln-search="{{id}}-list" class="ln-filter-search" placeholder="Пребарај...">
	<ul id="{{id}}-list" data-ln-filter="{{table_id}}" class="ln-filter-list">
		<li>
			<label class="ln-filter-option">
				<input type="checkbox" data-ln-filter-key="{{filter_key}}" data-ln-filter-reset checked> Сите
			</label>
		</li>
		<!-- OPTIONS_SLOT -->
	</ul>
</div>
