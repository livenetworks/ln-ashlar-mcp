<!-- Popover филтер за {{label}} -->
<div data-ln-popover id="{{id}}" class="ln-popover">
	<input type="search" data-ln-search="{{list_id}}" data-ln-search-items="li" class="ln-filter-search" placeholder="Пребарај...">
	<ul id="{{list_id}}" data-ln-filter="{{table_id}}" class="ln-filter-list">
		<li>
			<label class="ln-filter-option">
				<input type="checkbox" data-ln-filter-key="{{filter_key}}" data-ln-filter-reset checked> Сите
			</label>
		</li>
		<!-- OPTIONS_SLOT -->
	</ul>
</div>
