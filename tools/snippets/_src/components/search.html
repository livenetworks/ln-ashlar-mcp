<!-- ln-ashlar Search Input -->
<div class="ln-search-box" id="{{id}}">
	<input type="search" data-ln-search="{{target_id}}" data-ln-search-items="{{search_items}}"{{debounce_attr}} class="ln-search-input" placeholder="{{placeholder}}" aria-label="{{label}}">
	<svg class="ln-icon ln-search-icon" aria-hidden="true"><use href="#ln-search"></use></svg>
</div>
