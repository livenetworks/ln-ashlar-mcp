<!-- ln-ashlar Full CRUD Module: {{resource_title}} -->
<!-- data-ln-ui-coordinator мора да ги обвитка И тригерите И <dialog>-от: -->
<!-- ln-ui-coordinator прави triggerEl.closest('[data-ln-ui-coordinator]'). -->
<section class="ln-crud-module" id="{{id}}" data-ln-ui-coordinator>
	<header class="ln-crud-header">
		<div class="ln-crud-title-group">
			<h2>{{resource_title}}</h2>
			<p class="ln-crud-subtitle">Управување со {{resource_title}}</p>
		</div>
		<div class="ln-crud-actions">
			<a href="#{{modal_id}}" class="ln-btn ln-btn-primary" data-ln-modal-for="{{modal_id}}">
				<svg class="ln-icon" aria-hidden="true"><use href="#ln-icon-plus"></use></svg>
				Нов {{resource_singular}}
			</a>
		</div>
	</header>

	<!-- DATA_COORDINATOR_SLOT -->
</section>
