<!-- ln-ashlar Upload Component -->
<div class="ln-upload-dropzone" id="{{id}}" data-ln-upload data-ln-upload-accept="{{accept}}" data-ln-upload-max-size="{{max_size}}">
	<input type="file" id="{{id}}-input" name="{{name}}" class="ln-upload-input" accept="{{accept}}"{{multiple_attr}}{{required_attr}}>
	<label for="{{id}}-input" class="ln-upload-label">
		<svg class="ln-icon ln-upload-icon" aria-hidden="true"><use href="#ln-icon-cloud-upload"></use></svg>
		<span class="ln-upload-text">Повлечете фајл тука или <strong>прелистајте</strong></span>
		<span class="ln-upload-hint">{{hint}}</span>
	</label>
	<ul class="ln-upload-file-list" data-ln-upload-files></ul>
</div>
